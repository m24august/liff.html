<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ศูนย์ควบคุมงาน · โมโต24</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Leelawadee UI',Tahoma,sans-serif;background:#eef1f5;color:#1c2333}
.hd{background:#20235f;color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
.hd .t{font-size:16px;font-weight:700}.hd .s{font-size:11px;color:#b9bde6}
.rf{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:16px;padding:6px 12px;font-size:12px;font-weight:700}
.wrap{padding:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border-radius:11px;padding:10px 8px;text-align:center;border:1px solid #eceef5}
.kpi .n{font-size:22px;font-weight:800;line-height:1.1}.kpi .l{font-size:10px;color:#7a8097;margin-top:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tab{white-space:nowrap;font-size:12px;font-weight:600;padding:6px 12px;border-radius:16px;background:#e7e9f2;color:#5b6180}
.tab.on{background:#20235f;color:#fff}
.sec{font-size:12px;font-weight:700;color:#20235f;margin:14px 2px 8px}
.card{background:#fff;border-radius:11px;padding:10px 12px;margin-bottom:8px;border:1px solid #e7e9f2;border-left:4px solid #F26522;cursor:pointer}
.card.check{border-left-color:#2f80ed}.card.photo{border-left-color:#1c7a44}
.r1{display:flex;justify-content:space-between;align-items:center}
.nm{font-size:14px;font-weight:700}.sub{font-size:11px;color:#7a8097;margin-top:1px}
.chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.c-go{background:#dff3e6;color:#1c7a44}.c-hot{background:#ffe0e0;color:#b62c2c}.c-wait{background:#fff2d6;color:#9a6a00}.c-done{background:#e6e9f5;color:#4a4f83}
.who{font-size:11px;color:#5b6180;margin-top:5px}
.feed{background:#fff;border-radius:11px;border:1px solid #eceef5;padding:6px 12px}
.fi{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #f0f1f7;font-size:12px}
.fi:last-child{border:none}
.ft{font-size:10px;color:#a2a8be;white-space:nowrap;margin-left:auto}
.empty{text-align:center;color:#9098ad;font-size:13px;padding:30px}
.ov{position:fixed;inset:0;background:rgba(20,25,60,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.ov.hide{display:none}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:80vh;overflow:auto}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh .t{font-size:15px;font-weight:800;color:#20235f}
.x{font-size:20px;color:#7a8097;background:none;border:none}
.tl{border-left:2px solid #e2e5f0;padding-left:12px;margin-left:4px}
.tl .it{margin-bottom:12px;position:relative}
.tl .it:before{content:'';position:absolute;left:-17px;top:3px;width:9px;height:9px;border-radius:50%;background:#F26522}
.tl .dt{font-size:11px;color:#9098ad}.tl .tx{font-size:13px;margin-top:2px}
.tl .who2{font-size:11px;color:#5b6180}
.hide{display:none}
</style>
</head>
<body>
<script>
  var LIFF_ID = '2011293783-pnRFcRcN';
  var API_URL = 'https://script.google.com/macros/s/AKfycbxe_1a5j-TuNvulJ6CO9tD30uGRPLoDgPRPJqxfmpUb8MrpJYnt5RRW9oeEXZ3vtFjQRg/exec';
</script>

<div id="app" class="hide">
  <div class="hd"><div><div class="t">🗂️ ศูนย์ควบคุมงาน</div><div class="s" id="who">—</div></div><button class="rf" onclick="loadAll()">↻ รีเฟรช</button></div>
  <div class="wrap">
    <div class="kpis" id="kpis"></div>
    <div class="tabs" id="tabs">
      <div class="tab on" data-f="all">ทั้งหมด</div>
      <div class="tab" data-f="out">↗️ ส่งออก</div>
      <div class="tab" data-f="in">↘️ รับเข้า</div>
      <div class="tab" data-f="active">🔵 กำลังทำ</div>
      <div class="tab" data-f="hot">🔴 ต้องเร่ง</div>
      <div class="tab" data-f="done">✔️ ปิดแล้ว</div>
    </div>
    <div class="sec">📋 งานทั้งหมด (<span id="cnt">0</span>)</div>
    <div id="list"></div>
    <div class="sec">🔔 อัปเดตล่าสุด</div>
    <div class="feed" id="feed"></div>
  </div>
</div>

<div class="ov hide" id="modal">
  <div class="sheet">
    <div class="sh"><span class="t" id="mTitle">ไทม์ไลน์งาน</span><button class="x" onclick="closeModal()">✕</button></div>
    <div id="mInfo" style="font-size:13px;color:#5b6180;margin-bottom:10px"></div>
    <div class="tl" id="mTl"></div>
  </div>
</div>

<div class="empty hide" id="deny">เฉพาะแอดมินเท่านั้น 🔒</div>

<script>
var JOBS=[], FILTER='all', TOKEN='';
function api(action,data){ data=data||{}; data.action=action; data.accessToken=TOKEN;
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}).then(function(r){return r.json();}); }
async function boot(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){ liff.login(); return; }
    TOKEN=liff.getAccessToken();
    var w=await api('whoami');
    if(!w.ok){ document.body.innerHTML='<div class="empty">เข้าสู่ระบบไม่สำเร็จ</div>'; return; }
    if(!w.admin){ document.getElementById('deny').classList.remove('hide'); return; }
    document.getElementById('app').classList.remove('hide');
    document.getElementById('who').textContent=w.name+' · ส่วนกลาง';
    loadAll();
  }catch(e){ document.body.innerHTML='<div class="empty">โหลดไม่สำเร็จ: '+e+'</div>'; }
}
function isClosed(s){ return s && String(s).indexOf('ปิด')>=0; }
function isHot(s){ return /เกิน|ติดต่อไม่ได้/.test(s||''); }
function chipCls(s){ if(isClosed(s))return'c-done'; if(isHot(s))return'c-hot'; if(/นัด|จ่าย|ผ่าน/.test(s||''))return'c-go'; return'c-wait'; }
function typeCls(t){ if(/เช็ค/.test(t||''))return'check'; if(/ถ่ายภาพ|พิกัด|ยึดทรัพย์/.test(t||''))return'photo'; return''; }
function typeIcon(t){ if(/เช็ค/.test(t||''))return'🔍'; if(/ถ่ายภาพ|พิกัด|ยึดทรัพย์/.test(t||''))return'📸'; return'💰'; }
async function loadAll(){
  var r=await api('listJobs'); JOBS=(r.ok&&r.jobs)?r.jobs:[];
  renderKpis(); renderList();
  var f=await api('logFeed',{limit:40}); renderFeed((f.ok&&f.log)?f.log:[]);
}
function renderKpis(){
  var total=JOBS.length,
      active=JOBS.filter(function(j){return j.status && !isClosed(j.status);}).length,
      hot=JOBS.filter(function(j){return isHot(j.status);}).length,
      done=JOBS.filter(function(j){return isClosed(j.status);}).length;
  document.getElementById('kpis').innerHTML=
    '<div class="kpi"><div class="n" style="color:#20235f">'+total+'</div><div class="l">ทั้งหมด</div></div>'+
    '<div class="kpi"><div class="n" style="color:#1c5fb0">'+active+'</div><div class="l">กำลังทำ</div></div>'+
    '<div class="kpi"><div class="n" style="color:#c0392b">'+hot+'</div><div class="l">ต้องเร่ง</div></div>'+
    '<div class="kpi"><div class="n" style="color:#1c7a44">'+done+'</div><div class="l">ปิดแล้ว</div></div>';
}
function renderList(){
  var rows=JOBS.filter(function(j){
    if(FILTER==='active') return j.status && !isClosed(j.status);
    if(FILTER==='hot') return isHot(j.status);
    if(FILTER==='done') return isClosed(j.status);
    if(FILTER==='out') return j.direction==='ส่งออก';
    if(FILTER==='in') return j.direction==='รับเข้า';
    return true;
  });
  document.getElementById('cnt').textContent=rows.length;
  var box=document.getElementById('list');
  if(!rows.length){ box.innerHTML='<div class="empty">ไม่มีงานในหมวดนี้</div>'; return; }
  box.innerHTML=rows.map(function(j){
    return '<div class="card '+typeCls(j.type)+'" onclick="openJob(\''+j.jobId+'\')">'
      +'<div class="r1"><div><div class="nm">'+typeIcon(j.type)+' '+(j.customer||'-')+'</div>'
      +'<div class="sub">'+((j.direction==='รับเข้า')?'↘️ รับเข้า':'↗️ ส่งออก')+' · '+(j.type||'')+' · '+(j.branch||'-')+'</div></div>'
      +'<span class="chip '+chipCls(j.status)+'">'+(j.status||'รอรับงาน')+'</span></div>'
      +'<div class="who">👤 '+(j.assigneeName||j.assigneeUserId||'ยังไม่มอบหมาย')+(j.updatedAt?(' · '+fmtT(j.updatedAt)):'')+'</div></div>';
  }).join('');
}
function renderFeed(log){
  var box=document.getElementById('feed');
  if(!log.length){ box.innerHTML='<div class="empty">ยังไม่มีอัปเดต</div>'; return; }
  box.innerHTML=log.slice(0,20).map(function(l){
    return '<div class="fi"><b>'+(l.actorName||'-')+'</b> → '+(l.jobId||'')+' <span class="chip '+chipCls(l.status)+'">'+(l.status||l.action||'')+'</span><span class="ft">'+fmtT(l.time)+'</span></div>';
  }).join('');
}
function fmtT(v){ try{ var d=new Date(v); if(isNaN(d)) return String(v).slice(0,16); return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }catch(e){ return ''; } }
async function openJob(id){
  var j=JOBS.filter(function(x){return String(x.jobId)===String(id);})[0]; if(!j) return;
  document.getElementById('mTitle').textContent=(j.customer||id);
  var L=function(k,v){return v?('<br><span style="color:#8890ad">'+k+':</span> '+v):'';};
  var amt=j.amountDue?(Number((''+j.amountDue).replace(/[^0-9.]/g,'')||0).toLocaleString('en-US')):'';
  document.getElementById('mInfo').innerHTML=(j.type||'')+' · สาขา '+(j.branch||'-')+' · '+(j.assigneeName||j.assigneeUserId||'-')
    +'<br>สถานะล่าสุด: <b>'+(j.status||'-')+'</b>'
    +L('ยอดค้าง',amt+(j.instDue?(' ('+j.instDue+' งวด)'):''))+L('ทะเบียน',j.plate)+L('โทร',j.phone)
    +L('เลขที่สัญญา',j.contractNo)+L('ที่อยู่',j.address)+L('รถ',j.vehicle)+L('เลขตัวถัง',j.chassis)
    +L('งวดที่ค้าง',j.dueNo)+L('ค่างวด',j.instAmt)+L('ชำระล่าสุด',j.lastPay);
  document.getElementById('mTl').innerHTML='<div class="empty">กำลังโหลด...</div>';
  document.getElementById('modal').classList.remove('hide');
  var r=await api('jobLog',{jobId:id}); var log=(r.ok&&r.log)?r.log:[];
  if(!log.length){ document.getElementById('mTl').innerHTML='<div class="empty">ยังไม่มีประวัติอัปเดต</div>'; return; }
  document.getElementById('mTl').innerHTML=log.map(function(l){
    return '<div class="it"><div class="dt">'+fmtT(l.time)+'</div>'
      +'<div class="tx"><b>'+(l.status||l.action||'')+'</b>'+(l.note?(' · '+l.note):'')+'</div>'
      +'<div class="who2">👤 '+(l.actorName||'')+(l.lat?(' · 📍'+l.lat+','+l.lng):'')+(l.photos?(' · 📷'+String(l.photos).split(',').filter(String).length):'')+'</div></div>';
  }).join('');
}
function closeModal(){ document.getElementById('modal').classList.add('hide'); }
document.querySelectorAll('.tab').forEach(function(t){ t.onclick=function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');}); t.classList.add('on'); FILTER=t.dataset.f; renderList();
};});
boot();
</script>
</body>
</html>
