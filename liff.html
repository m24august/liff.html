<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>งานของฉัน · โมโต24</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Leelawadee UI',Tahoma,sans-serif;background:#f6f7fb;color:#1c2333}
.hd{background:#20235f;color:#fff;padding:14px 16px}
.hd .t{font-size:17px;font-weight:700}
.hd .s{font-size:12px;color:#b9bde6;margin-top:2px}
.tabs{display:flex;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid #eceef5;position:sticky;top:0;z-index:5}
.tab{flex:1;text-align:center;font-size:12.5px;font-weight:600;padding:8px 0;border-radius:9px;background:#eef0f7;color:#5b6180;cursor:pointer}
.tab.on{background:#20235f;color:#fff}
.wrap{padding:12px}
.card{background:#fff;border-radius:14px;padding:12px 13px;margin-bottom:10px;border:1px solid #e7e9f2;cursor:pointer}
.card .top{display:flex;align-items:center;gap:9px}
.ic{width:34px;height:34px;border-radius:9px;background:#fdecdf;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 34px}
.nm{font-size:14px;font-weight:700}
.sub{font-size:12px;color:#7a8097;margin-top:1px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#eef0f7;color:#4a4f83}
.due{font-size:11px;color:#9098ad}
label{display:block;font-size:12px;font-weight:600;color:#5b6180;margin:12px 2px 5px}
.inp{width:100%;border:1px solid #d7dbe8;border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff}
textarea.inp{resize:vertical}
.det{background:#fff;border-radius:12px;padding:13px;font-size:13.5px;line-height:1.7}
.det b{color:#20235f}
.big{background:#fff6f0;border:1px solid #f5d3bd;border-radius:12px;padding:10px 13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.big .l{font-size:11px;color:#a8541f}.big .n{font-size:20px;font-weight:800;color:#d24e12}
.blk{background:#fff;border-radius:12px;border:1px solid #e7e9f2;padding:11px 13px;margin-bottom:10px}
.bt{font-size:11.5px;font-weight:800;color:#20235f;margin-bottom:7px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:12.8px;padding:3px 0;line-height:1.5}
.row .k{color:#7a8097;white-space:nowrap}.row .v{font-weight:600;text-align:right}
.cbs{display:flex;gap:8px;margin-top:9px}
.cb{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:9px;border-radius:9px;text-decoration:none;display:block}
.cb.call{background:#dff3e6;color:#1c7a44}.cb.map{background:#e2f0ff;color:#1c5fb0}
.cbcard{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.cbcard .amt{font-size:15px;font-weight:800;color:#d24e12}
.cbcard .amt small{font-size:9px;color:#a8541f;font-weight:600;display:block;text-align:right;line-height:1}
.cbcard .due{font-size:12px;color:#b62c2c;font-weight:700}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pho{width:70px;height:70px;border-radius:10px;object-fit:cover;border:1px solid #d7dbe8}
.addp{width:70px;height:70px;border-radius:10px;background:#eef0f7;border:1px dashed #c3c8dc;display:flex;align-items:center;justify-content:center;font-size:26px;color:#9aa0bd;cursor:pointer}
.gps{display:flex;align-items:center;gap:8px;margin-top:6px;background:#eefaf2;border:1px solid #bfe6cf;border-radius:10px;padding:9px 11px;font-size:12.5px;color:#1c7a44;font-weight:600;cursor:pointer}
.gps.empty{background:#fff5e6;border-color:#f0d59a;color:#9a6a00}
.btn{display:block;width:100%;text-align:center;background:#F26522;color:#fff;font-weight:700;font-size:15px;padding:14px;border-radius:12px;margin-top:16px;border:none;cursor:pointer}
.back{font-size:13px;color:#20235f;font-weight:600;padding:4px 0;cursor:pointer;display:inline-block;margin-bottom:6px}
.empty{text-align:center;color:#9098ad;font-size:13px;padding:40px 20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#20235f;color:#fff;font-size:13px;padding:10px 18px;border-radius:22px;opacity:0;transition:.25s;z-index:20}
.toast.show{opacity:1}
.hide{display:none}
</style>
</head>
<body>
<script>
  var LIFF_ID = '2011293783-GAabvAXy';
  var API_URL = 'https://script.google.com/macros/s/AKfycbxe_1a5j-TuNvulJ6CO9tD30uGRPLoDgPRPJqxfmpUb8MrpJYnt5RRW9oeEXZ3vtFjQRg/exec';
</script>

<div id="app" class="hide">
  <div id="listView">
    <div class="hd"><div class="t">📋 งานของฉัน</div><div class="s" id="who">—</div></div>
    <div class="tabs">
      <div class="tab on" data-f="all">ทั้งหมด</div>
      <div class="tab" data-f="open">🔵 ยังไม่ปิด</div>
      <div class="tab" data-f="hot">🔴 เกินกำหนด</div>
    </div>
    <div class="wrap" id="list"></div>
    <button id="addBtn" onclick="openSubmit()" style="position:fixed;bottom:18px;right:18px;z-index:50;background:#20235f;color:#fff;border:none;border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(20,25,60,.35);cursor:pointer">➕ ส่งงานให้ส่วนกลาง</button>
  </div>

  <div id="detailView" class="hide">
    <div class="hd"><span class="back" onclick="showList()">‹ กลับ</span><div class="t" id="dTitle">งาน</div><div class="s" id="dSub">—</div></div>
    <div class="wrap">
      <div id="dInfo"></div>
      <label>สถานะการติดตาม</label>
      <select class="inp" id="fStatus">
        <option>รับงานแล้ว</option>
        <option>นัดจ่ายตามกำหนด</option>
        <option>จ่ายแล้วบางส่วน</option>
        <option>ติดต่อไม่ได้</option>
        <option>ยึดรถ</option>
        <option>คืนรถ</option>
        <option>ปิดงาน</option>
      </select>
      <label>บันทึกเพิ่มเติม</label>
      <textarea class="inp" id="fNote" rows="2" placeholder="เช่น ลูกค้านัดจ่าย 30 ส.ค."></textarea>
      <label>แนบรูป (สลิป / รถ / สถานที่)</label>
      <div class="photos" id="photoBox"><div class="addp" onclick="document.getElementById('fPhoto').click()">＋</div></div>
      <input type="file" id="fPhoto" accept="image/*" capture="environment" class="hide" onchange="addPhoto(event)">
      <label>เช็คอินพิกัด</label>
      <div class="gps empty" id="gpsBox" onclick="getGps()">📍 แตะเพื่อปักหมุดพิกัด</div>
      <button class="btn" id="submitBtn" onclick="submitUpdate()">✓ ส่งอัปเดต</button>
    </div>
  </div>
  <div id="submitView" class="hide">
    <div class="hd"><span class="back" onclick="showList()">‹ กลับ</span><div class="t">➕ ส่งงานให้ส่วนกลาง</div><div class="s">พันธมิตรส่งงาน “รับเข้า”</div></div>
    <div class="wrap">
      <label>ประเภทงาน</label>
      <select class="inp" id="sType"><option>ติดตามหนี้</option><option>เช็คก่อนขาย</option><option>ถ่ายภาพพิกัด/ยึดทรัพย์</option></select>
      <label>ชื่อลูกค้า *</label><input class="inp" id="sCustomer" placeholder="ชื่อ-นามสกุล">
      <label>ทะเบียนรถ</label><input class="inp" id="sPlate" placeholder="เช่น 1กข 234">
      <label>จังหวัด/พื้นที่</label><input class="inp" id="sBranch" placeholder="เช่น ตรัง">
      <label>ค้าง (งวด)</label><input class="inp" id="sInst" placeholder="เช่น 3">
      <label>ยอดค้าง (บาท)</label><input class="inp" id="sAmount" placeholder="เช่น 8400">
      <label>เบอร์โทร</label><input class="inp" id="sPhone" placeholder="08x-xxx-xxxx">
      <label>เลขที่สัญญา</label><input class="inp" id="sContract" placeholder="เช่น 0201250227000001">
      <label>ที่อยู่</label><textarea class="inp" id="sAddress" rows="2" placeholder="บ้านเลขที่ / ตำบล / อำเภอ / จังหวัด"></textarea>
      <label>รุ่นรถ / สี</label><input class="inp" id="sVehicle" placeholder="เช่น HONDA AFS110 · ดำเทา">
      <label>เลขตัวถัง</label><input class="inp" id="sChassis" placeholder="เช่น MLHJA144P5291655">
      <label>งวดที่ค้าง</label><input class="inp" id="sDueNo" placeholder="เช่น 13-16">
      <label>ค่างวด / งวด (บาท)</label><input class="inp" id="sInstAmt" placeholder="เช่น 1510">
      <label>ชำระล่าสุด</label><input class="inp" id="sLastPay" placeholder="เช่น 30/06/2026 · 7,482">
      <label>รายละเอียด / เบาะแสที่อยู่</label><textarea class="inp" id="sNote" rows="2" placeholder="ข้อมูลเพิ่มเติม / นัดหมาย"></textarea>
      <button class="btn" id="sBtn" onclick="submitNewJob()">📨 ส่งงานให้ส่วนกลาง</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var TOKEN='', ME={}, JOBS=[], CUR=null, PHOTOS=[], GPS=null, FILTER='all';
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); setTimeout(function(){el.classList.remove('show');},2200); }
function api(action,data){ data=data||{}; data.action=action; data.accessToken=TOKEN;
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}).then(function(r){return r.json();}); }
async function boot(){
  try{
    await liff.init({liffId:LIFF_ID});
    if(!liff.isLoggedIn()){ liff.login(); return; }
    TOKEN=liff.getAccessToken();
    document.getElementById('app').classList.remove('hide');
    var w=await api('whoami'); if(!w.ok){ toast('เข้าสู่ระบบไม่สำเร็จ'); return; }
    ME=w; document.getElementById('who').textContent=w.name+(w.admin?' (แอดมิน)':'');
    loadJobs();
  }catch(e){ document.body.innerHTML='<div class="empty">โหลดไม่สำเร็จ: '+e+'<br>ตรวจ LIFF_ID / API_URL</div>'; }
}
async function loadJobs(){ var r=await api('myJobs'); JOBS=(r.ok&&r.jobs)?r.jobs:[]; renderList(); }
function fmt(n){ if(n===''||n==null) return '-'; var x=(''+n).replace(/[^0-9.]/g,''); if(x==='') return n; return Number(x).toLocaleString('en-US'); }
function row(k,v,st){ return v?('<div class="row"><span class="k">'+k+'</span><span class="v"'+(st?(' style="'+st+'"'):'')+'>'+v+'</span></div>'):''; }
function renderDetail(j){
  var tel=(''+(j.phone||'')).replace(/[^0-9+]/g,'');
  var q=encodeURIComponent(j.address||((j.plate||'')+' '+(j.branch||'')));
  var h='<div class="big"><div><div class="l">ยอดค้าง</div><div class="n">'+fmt(j.amountDue)+'</div></div>'
    +'<div style="text-align:right"><div class="l">งวดค้าง</div><div style="font-size:15px;font-weight:800;color:#b62c2c">'+(j.instDue||'-')+' งวด</div></div></div>';
  // ลูกหนี้
  var b1=row('ชื่อ',j.customer)+row('เลขที่สัญญา',j.contractNo,'font-size:11px')+row('โทร',j.phone,'color:#1c7a44')+row('ที่อยู่',(j.address||'').replace(/\n/g,'<br>'),'text-align:right;font-size:11.5px');
  if(b1){ h+='<div class="blk"><div class="bt">👤 ลูกหนี้</div>'+b1;
    var cbs=''; if(tel) cbs+='<a class="cb call" href="tel:'+tel+'">📞 โทร</a>'; if(q) cbs+='<a class="cb map" href="https://maps.google.com/?q='+q+'" target="_blank">🗺️ แผนที่</a>';
    if(cbs) h+='<div class="cbs">'+cbs+'</div>'; h+='</div>'; }
  // รถ
  var b2=row('รุ่น/สี',j.vehicle,'font-size:11.5px')+row('ทะเบียน',j.plate)+row('เลขตัวถัง',j.chassis,'font-size:11px');
  if(b2) h+='<div class="blk"><div class="bt">🏍️ รถ</div>'+b2+'</div>';
  // หนี้
  var b3=row('งวดที่ค้าง',j.dueNo)+row('ค่างวด',j.instAmt?(fmt(j.instAmt)+' /งวด'):'')+row('ยอดค้าง',fmt(j.amountDue))+row('ชำระล่าสุด',j.lastPay);
  if(b3) h+='<div class="blk"><div class="bt">💳 หนี้</div>'+b3+'</div>';
  if(j.note) h+='<div class="blk"><div class="bt">📝 โน้ตล่าสุด</div><div style="font-size:12.5px;line-height:1.6">'+j.note+'</div></div>';
  return h;
}
function statusChip(s){
  var map={'เกินกำหนด':'background:#ffe0e0;color:#b62c2c','ติดต่อไม่ได้':'background:#ffe0e0;color:#b62c2c','นัดจ่ายตามกำหนด':'background:#dff3e6;color:#1c7a44','ปิดงาน':'background:#e6e9f5;color:#4a4f83','รอรับงาน':'background:#fff2d6;color:#9a6a00'};
  return '<span class="chip" style="'+(map[s]||'')+'">'+(s||'-')+'</span>';
}
function renderList(){
  var box=document.getElementById('list'), rows=JOBS.filter(function(j){
    if(FILTER==='open') return j.status!=='ปิดงาน';
    if(FILTER==='hot')  return String(j.status).indexOf('เกิน')>=0||j.status==='ติดต่อไม่ได้';
    return true;
  });
  if(!rows.length){ box.innerHTML='<div class="empty">ยังไม่มีงานในหมวดนี้ 🎉</div>'; return; }
  box.innerHTML=rows.map(function(j){
    var amt=j.amountDue?('<span class="amt">'+fmt(j.amountDue)+'<small>ยอดค้าง</small></span>'):'';
    var due=j.instDue?('<span class="due">ค้าง '+j.instDue+' งวด</span>'):'<span></span>';
    return '<div class="card" onclick="openJob(\''+j.jobId+'\')"><div class="top"><div class="ic">💰</div>'
      +'<div><div class="nm">'+(j.customer||'-')+'</div><div class="sub">'+(j.plate?(j.plate+' · '):'')+'สาขา '+(j.branch||'-')+'</div></div>'
      +'<div style="margin-left:auto">'+statusChip(j.status)+'</div></div>'
      +'<div class="cbcard">'+due+amt+'</div></div>';
  }).join('');
}
function openJob(id){
  CUR=JOBS.filter(function(j){return String(j.jobId)===String(id);})[0]; if(!CUR) return;
  PHOTOS=[]; GPS=null;
  document.getElementById('dTitle').textContent='💰 '+(CUR.type||'ติดตามหนี้');
  document.getElementById('dSub').textContent=(CUR.customer||'')+' · สาขา '+(CUR.branch||'');
  document.getElementById('dInfo').innerHTML=renderDetail(CUR);
  document.getElementById('fNote').value='';
  document.getElementById('photoBox').innerHTML='<div class="addp" onclick="document.getElementById(\'fPhoto\').click()">＋</div>';
  document.getElementById('gpsBox').className='gps empty'; document.getElementById('gpsBox').textContent='📍 แตะเพื่อปักหมุดพิกัด';
  document.getElementById('listView').classList.add('hide'); document.getElementById('detailView').classList.remove('hide'); window.scrollTo(0,0);
}
function showList(){ document.getElementById('detailView').classList.add('hide'); var sv=document.getElementById('submitView'); if(sv) sv.classList.add('hide'); document.getElementById('listView').classList.remove('hide'); }
function addPhoto(ev){
  var file=ev.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=1000, sc=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement('canvas'); c.width=img.width*sc; c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var d=c.toDataURL('image/jpeg',0.75); PHOTOS.push(d);
      var im=document.createElement('img'); im.src=d; im.className='pho';
      document.getElementById('photoBox').insertBefore(im, document.querySelector('#photoBox .addp'));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file); ev.target.value='';
}
function getGps(){
  if(!navigator.geolocation){ toast('อุปกรณ์ไม่รองรับ GPS'); return; }
  var box=document.getElementById('gpsBox'); box.textContent='⏳ กำลังหาพิกัด...';
  navigator.geolocation.getCurrentPosition(function(p){
    GPS={lat:p.coords.latitude.toFixed(6), lng:p.coords.longitude.toFixed(6)};
    box.className='gps'; box.textContent='📍 ปักหมุดแล้ว · '+GPS.lat+', '+GPS.lng;
  },function(){ box.className='gps empty'; box.textContent='📍 แตะเพื่อปักหมุด (ไม่อนุญาตตำแหน่ง)'; },{enableHighAccuracy:true,timeout:8000});
}
async function submitUpdate(){
  var btn=document.getElementById('submitBtn'); btn.textContent='กำลังส่ง...'; btn.disabled=true;
  var body={ jobId:CUR.jobId, status:document.getElementById('fStatus').value, note:document.getElementById('fNote').value, photosB64:PHOTOS };
  if(GPS){ body.lat=GPS.lat; body.lng=GPS.lng; }
  var r=await api('updateJob',body);
  btn.textContent='✓ ส่งอัปเดต'; btn.disabled=false;
  if(r.ok){ toast('บันทึกแล้ว ✔'); await loadJobs(); showList(); } else toast('ส่งไม่สำเร็จ: '+(r.error||''));
}
function openSubmit(){ document.getElementById('listView').classList.add('hide'); document.getElementById('submitView').classList.remove('hide'); window.scrollTo(0,0); }
async function submitNewJob(){
  var cust=document.getElementById('sCustomer').value.trim();
  if(!cust){ toast('กรอกชื่อลูกค้าก่อน'); return; }
  var btn=document.getElementById('sBtn'); btn.textContent='กำลังส่ง...'; btn.disabled=true;
  var g=function(id){return document.getElementById(id).value;};
  var body={ type:g('sType'), customer:cust, plate:g('sPlate'), branch:g('sBranch'), instDue:g('sInst'), amountDue:g('sAmount'), phone:g('sPhone'), note:g('sNote'),
             contractNo:g('sContract'), address:g('sAddress'), vehicle:g('sVehicle'), chassis:g('sChassis'), dueNo:g('sDueNo'), instAmt:g('sInstAmt'), lastPay:g('sLastPay') };
  var r=await api('submitJob',body);
  btn.textContent='📨 ส่งงานให้ส่วนกลาง'; btn.disabled=false;
  if(r.ok){ toast('ส่งงานแล้ว ✔ '+(r.jobId||'')); ['sCustomer','sPlate','sBranch','sInst','sAmount','sPhone','sNote','sContract','sAddress','sVehicle','sChassis','sDueNo','sInstAmt','sLastPay'].forEach(function(id){document.getElementById(id).value='';}); showList(); }
  else toast('ส่งไม่สำเร็จ: '+(r.error||''));
}
document.querySelectorAll('.tab').forEach(function(t){ t.onclick=function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');}); t.classList.add('on'); FILTER=t.dataset.f; renderList();
};});
boot();
</script>
</body>
</html>
